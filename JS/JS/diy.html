<body onload="process()">

    <img src="./1.jfif" alt="" width="100" height="100" id="img">

    <script>
        const arr=["1.jfif","2.jfif","3.jfif","4.jfif",];
        function process(){
            document.querySelector("#img").src=arr[1];
            setInterval(() => {
                document.title=i
            document.querySelector("#img").src=arr[i];
            i=i+1;
            if(i===4){
                i=0;
            }
            }, 1000);
        }
    </script>

</body>
</html>
